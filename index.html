<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 8th Month Anniversary ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3,
        #ffc3d4
    );
}

/* Floating Hearts */
.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    top:0;
    left:0;
    z-index:0;
}

.heart{
    position:absolute;
    color:rgba(255,255,255,0.7);
    font-size:20px;
    animation:float 10s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) rotate(0deg);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Card */
.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:750px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 8px 40px rgba(0,0,0,0.15);
    text-align:center;
    color:white;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-5px);
}

.title{
    font-size:2.2rem;
    margin-bottom:15px;
}

.big-heart{
    font-size:60px;
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.15);
    }
}

.line{
    width:120px;
    height:3px;
    background:white;
    margin:20px auto;
    border-radius:20px;
}

.message{
    font-size:1.1rem;
    line-height:1.9;
    margin-top:15px;
}

.signature{
    margin-top:30px;
    font-size:1.2rem;
    font-weight:bold;
}

@media(max-width:600px){
    .card{
        padding:30px 20px;
    }

    .title{
        font-size:1.7rem;
    }

    .message{
        font-size:1rem;
    }
}
</style>
</head>
<body>

<div class="hearts">
    <span class="heart" style="left:5%; animation-delay:0s;">❤️</span>
    <span class="heart" style="left:15%; animation-delay:2s;">💕</span>
    <span class="heart" style="left:25%; animation-delay:4s;">❤️</span>
    <span class="heart" style="left:35%; animation-delay:1s;">💖</span>
    <span class="heart" style="left:45%; animation-delay:6s;">❤️</span>
    <span class="heart" style="left:55%; animation-delay:3s;">💕</span>
    <span class="heart" style="left:65%; animation-delay:7s;">💖</span>
    <span class="heart" style="left:75%; animation-delay:5s;">❤️</span>
    <span class="heart" style="left:85%; animation-delay:2s;">💕</span>
    <span class="heart" style="left:95%; animation-delay:8s;">💖</span>
</div>

<div class="card">

    <div class="big-heart">❤️</div>

    <h1 class="title">Happy 8th Month Anniversary</h1>

    <div class="line"></div>

    <p class="message">
